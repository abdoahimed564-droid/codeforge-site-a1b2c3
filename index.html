<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><style></style>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chicken Invaders — Hyper Galaxy (HTML5)</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050812;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      color: #f8fafc;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(3, 6, 18, 0.78);
      backdrop-filter: blur(4px);
      z-index: 10;
      padding: 16px;
      text-align: center;
    }
    .overlay.active { display: flex; }
    h1 {
      margin: 0 0 18px;
      font-size: clamp(28px, 5vw, 48px);
      color: #facc15;
      text-shadow: 0 4px 20px rgba(250, 204, 21, 0.35);
      line-height: 1.25;
    }
    h2 {
      margin: 0 0 12px;
      font-size: clamp(22px, 4vw, 34px);
      color: #38bdf8;
    }
    .btn {
      min-width: 260px;
      max-width: 92vw;
      padding: 12px 22px;
      margin: 6px;
      border: 2px solid rgba(255,255,255,0.22);
      border-radius: 10px;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.15s ease;
    }
    .btn:hover:not(:disabled) { transform: scale(1.03); filter: brightness(1.08); }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn:disabled { opacity: 0.48; cursor: not-allowed; }
    .btn-green { background: #16a34a; }
    .btn-blue { background: #2563eb; }
    .btn-amber { background: #d97706; }
    .btn-red { background: #dc2626; }
    .btn-slate { background: #475569; }
    .shop-list {
      width: min(540px, 95vw);
      max-height: 62vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 8px 0 14px;
    }
    .shop-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 10px;
      padding: 10px 14px;
      gap: 10px;
      text-align: right;
    }
    .shop-item button {
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      background: #eab308;
      color: #0f172a;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }
    .shop-item button:disabled { background: #475569; color: #cbd5e1; cursor: not-allowed; }
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: none;
      z-index: 5;
      padding: 12px 18px;
    }
    #hud.active { display: block; }
    .hud-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .hud-col { display: flex; flex-direction: column; gap: 4px; font-size: 18px; font-weight: 700; text-shadow: 0 2px 6px rgba(0,0,0,0.8); }
    .bar-wrap { width: 200px; height: 14px; background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255,255,255,0.25); border-radius: 7px; overflow: hidden; margin-top: 4px; }
    .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #38bdf8, #a855f7); transition: width 0.12s linear; }
    #boss-bar-wrap {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: min(440px, 65vw);
      height: 20px;
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid #a855f7;
      border-radius: 10px;
      overflow: hidden;
      display: none;
      z-index: 6;
    }
    #boss-bar-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #dc2626, #facc15); }
    .touch-controls {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      display: none;
      justify-content: space-between;
      z-index: 8;
      pointer-events: none;
    }
    .touch-btn {
      pointer-events: auto;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.3);
      background: rgba(30, 41, 59, 0.72);
      color: #fff;
      font-size: 22px;
      font-weight: 800;
    }
    @media (hover: none) and (pointer: coarse) {
      .touch-controls.active { display: flex; }
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="boss-bar-wrap">
    <div id="boss-bar-fill"></div>
  </div>

  <div id="hud">
    <div class="hud-row">
      <div class="hud-col">
        <div id="hud-score">النقاط: 0</div>
        <div id="hud-coins" style="color:#facc15">الفلوس: 0</div>
        <div id="hud-combo" style="color:#fb923c"></div>
        <div id="hud-buffs" style="color:#38bdf8; font-size:15px;"></div>
      </div>
      <div class="hud-col" style="text-align:left;">
        <div id="hud-wave" style="color:#38bdf8">L1 - Wave 1/3</div>
        <div id="hud-hp" style="color:#4ade80">الصحة: 3 / 3</div>
        <div class="bar-wrap"><div id="nova-bar-fill" class="bar-fill"></div></div>
      </div>
    </div>
  </div>

  <div id="touch-controls" class="touch-controls">
    <div style="display:flex; gap:12px;">
      <button class="touch-btn" id="btn-left">◀</button>
      <button class="touch-btn" id="btn-right">▶</button>
    </div>
    <button class="touch-btn" id="btn-nova" style="background:rgba(147,51,234,0.82); font-size:15px;">NOVA</button>
  </div>

  <!-- القائمة الرئيسية -->
  <div id="screen-menu" class="overlay active">
    <h1>CHICKEN INVADERS<br/>HYPER GALAXY</h1>
    <button class="btn btn-green" id="btn-play-current">PLAY CURRENT LEVEL</button>
    <button class="btn btn-blue" id="btn-open-levels">SELECT LEVEL (1–5)</button>
    <button class="btn btn-amber" id="btn-open-shop">UPGRADE SHOP</button>
  </div>

  <!-- شاشة اختيار الليفلات -->
  <div id="screen-levels" class="overlay">
    <h2>SELECT GALAXY SECTOR (LEVELS)</h2>
    <div id="levels-container" style="display:flex; flex-direction:column; align-items:center;"></div>
    <button class="btn btn-red" id="btn-levels-back" style="margin-top:14px;">BACK TO MENU</button>
  </div>

  <!-- شاشة المتجر -->
  <div id="screen-shop" class="overlay">
    <h2>HYPER ARMORY & SHOP</h2>
    <div id="shop-coins" style="color:#facc15; font-size:21px; font-weight:700;"></div>
    <div id="shop-banner" style="color:#4ade80; font-size:16px; min-height:24px; margin-top:4px;"></div>
    <div id="shop-list" class="shop-list"></div>
    <button class="btn btn-red" id="btn-shop-back">BACK TO MENU</button>
  </div>

  <!-- شاشة الخسارة -->
  <div id="screen-gameover" class="overlay">
    <h1 style="color:#f87171;">GAME OVER</h1>
    <div id="go-stats" style="font-size:21px; line-height:1.7; margin-bottom:16px;"></div>
    <button class="btn btn-green" id="btn-retry">RETRY LEVEL</button>
    <button class="btn btn-amber" id="btn-go-shop">GO TO SHOP</button>
    <button class="btn btn-slate" id="btn-go-menu">MAIN MENU</button>
  </div>

  <!-- شاشة الفوز -->
  <div id="screen-victory" class="overlay">
    <h1 style="color:#4ade80;">LEVEL CLEARED!</h1>
    <div id="vic-stats" style="font-size:21px; line-height:1.7; margin-bottom:16px;"></div>
    <button class="btn btn-green" id="btn-next-level">NEXT LEVEL</button>
    <button class="btn btn-amber" id="btn-vic-shop">UPGRADE SHOP</button>
    <button class="btn btn-slate" id="btn-vic-menu">MAIN MENU</button>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const MAX_LEVEL = 5;
    const SAVE_KEY = "chicken_hyper_galaxy_html_v1";

    const LEVEL_THEMES = [
      { name: "LVL 1: NEBULA OUTPOST", bg: "#050812", neb1: "rgba(148,51,235,0.16)", neb2: "rgba(14,165,233,0.15)", spd: 1.0, waves: 3, reward: 120 },
      { name: "LVL 2: CRIMSON BELT", bg: "#13060b", neb1: "rgba(225,29,72,0.16)", neb2: "rgba(249,115,22,0.14)", spd: 1.18, waves: 3, reward: 200 },
      { name: "LVL 3: CYBER NEON CORE", bg: "#070518", neb1: "rgba(20,184,166,0.16)", neb2: "rgba(217,70,239,0.15)", spd: 1.35, waves: 4, reward: 300 },
      { name: "LVL 4: SOLAR FLARE STORM", bg: "#140d04", neb1: "rgba(245,158,11,0.18)", neb2: "rgba(234,88,12,0.15)", spd: 1.52, waves: 4, reward: 450 },
      { name: "LVL 5: OMEGA THRONE", bg: "#0d0416", neb1: "rgba(168,85,247,0.20)", neb2: "rgba(250,204,21,0.16)", spd: 1.72, waves: 5, reward: 750 }
    ];

    let state = "MENU"; // MENU, LEVELS, PLAYING, SHOP, GAMEOVER, VICTORY
    let coins = 200;
    let score = 0;
    let bestScore = 0;
    let currentLevel = 1;
    let unlockedLevel = 1;
    let wave = 1;
    let wavesPerLevel = 3;
    let enemiesRemaining = 0;
    let bossActive = false;
    let boss = null;

    let comboCount = 0;
    let comboTimer = 0;

    let upg = {
      multishot: 1,
      damage: 1,
      firerate: 1,
      speed: 1,
      hp: 3,
      magnet: 1,
      nova: 1
    };

    let currentHp = 3;
    let overdriveTimer = 0;
    let magnetTimer = 0;
    let shieldTimer = 0;
    let specialCharge = 0;
    let fireCooldown = 0;
    let spawnTimer = 0;
    let screenShake = 0;
    let flashAlpha = 0;

    let player = { x: 400, y: 500, tilt: 0 };
    let lasers = [];
    let chickens = [];
    let eggs = [];
    let pickups = [];
    let particles = [];
    let shockwaves = [];
    let stars = [];

    const keys = { left: false, right: false };

    // صوت توليدي بسيط بـ Web Audio API
    let audioCtx = null;
    function ensureAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    }

    function playSfx(type) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === "laser") {
        osc.type = "square";
        osc.frequency.setValueAtTime(1100, now);
        osc.frequency.exponentialRampToValueAtTime(220, now + 0.07);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
        osc.start(now); osc.stop(now + 0.07);
      } else if (type === "explosion") {
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(28, now + 0.25);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.start(now); osc.stop(now + 0.25);
      } else if (type === "coin") {
        osc.type = "sine";
        osc.frequency.setValueAtTime(1046, now);
        osc.frequency.setValueAtTime(1568, now + 0.06);
        gain.gain.setValueAtTime(0.09, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
        osc.start(now); osc.stop(now + 0.14);
      } else if (type === "powerup" || type === "buy") {
        osc.type = "triangle";
        osc.frequency.setValueAtTime(420, now);
        osc.frequency.exponentialRampToValueAtTime(1320, now + 0.18);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.start(now); osc.stop(now + 0.18);
      } else if (type === "nova") {
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(750, now);
        osc.frequency.exponentialRampToValueAtTime(45, now + 0.42);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
        osc.start(now); osc.stop(now + 0.42);
      } else if (type === "hit") {
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(210, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.18);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.start(now); osc.stop(now + 0.18);
      } else if (type === "victory") {
        osc.type = "triangle";
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.12);
        osc.frequency.setValueAtTime(783.99, now + 0.24);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        osc.start(now); osc.stop(now + 0.45);
      }
    }

    function saveProgress() {
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({
          coins, bestScore, unlockedLevel, upg
        }));
      } catch (e) {}
    }

    function loadProgress() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (typeof data.coins === "number") coins = data.coins;
        if (typeof data.bestScore === "number") bestScore = data.bestScore;
        if (typeof data.unlockedLevel === "number") unlockedLevel = Math.min(MAX_LEVEL, Math.max(1, data.unlockedLevel));
        if (data.upg) upg = { ...upg, ...data.upg };
      } catch (e) {}
    }

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      player.y = canvas.height - 75;
      player.x = Math.min(Math.max(player.x, 40), canvas.width - 40);
    }

    function initStars() {
      stars = [];
      for (let i = 0; i < 110; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          s: 1.5 + Math.random() * 2.8,
          spd: 65 + Math.random() * 145,
          a: 0.35 + Math.random() * 0.65
        });
      }
    }

    function clearEntities() {
      bossActive = false;
      boss = null;
      lasers = [];
      chickens = [];
      eggs = [];
      pickups = [];
      particles = [];
      shockwaves = [];
      document.getElementById("boss-bar-wrap").style.display = "none";
    }

    function switchState(next) {
      state = next;
      document.getElementById("screen-menu").classList.toggle("active", state === "MENU");
      document.getElementById("screen-levels").classList.toggle("active", state === "LEVELS");
      document.getElementById("screen-shop").classList.toggle("active", state === "SHOP");
      document.getElementById("screen-gameover").classList.toggle("active", state === "GAMEOVER");
      document.getElementById("screen-victory").classList.toggle("active", state === "VICTORY");
      document.getElementById("hud").classList.toggle("active", state === "PLAYING");
      document.getElementById("touch-controls").classList.toggle("active", state === "PLAYING");

      if (state !== "PLAYING") {
        clearEntities();
        screenShake = 0;
        flashAlpha = 0;
      }
      if (state === "LEVELS") renderLevelsScreen();
      if (state === "SHOP") {
        document.getElementById("shop-banner").textContent = "طور أسلحتك ودروعك قبل الهجوم!";
        renderShopScreen();
      }
    }

    function renderLevelsScreen() {
      const box = document.getElementById("levels-container");
      box.innerHTML = "";
      LEVEL_THEMES.forEach((th, idx) => {
        const lvl = idx + 1;
        const btn = document.createElement("button");
        btn.className = "btn btn-slate";
        if (lvl <= unlockedLevel) {
          btn.textContent = `${th.name}  |  مكافأة: +${th.reward} عملة`;
          btn.onclick = () => { ensureAudio(); startLevel(lvl); };
        } else {
          btn.disabled = true;
          btn.textContent = `${th.name}  [مغلق]`;
        }
        box.appendChild(btn);
      });
    }

    function getUpgradeCost(key) {
      switch (key) {
        case "multishot": return upg.multishot * 140;
        case "damage": return upg.damage * 90;
        case "firerate": return upg.firerate * 85;
        case "speed": return upg.speed * 70;
        case "hp": return (upg.hp - 2) * 100;
        case "magnet": return upg.magnet * 80;
        case "nova": return upg.nova * 110;
      }
      return 9999;
    }

    function renderShopScreen() {
      document.getElementById("shop-coins").textContent = `رصيدك الحالي: ${coins} عملة ذهبية`;
      const list = document.getElementById("shop-list");
      list.innerHTML = "";

      const defs = [
        { key: "multishot", title: `الطلقات المتعددة (${upg.multishot}/5)`, max: upg.multishot >= 5 },
        { key: "damage", title: `قوة الليزر (Lv.${upg.damage})`, max: false },
        { key: "firerate", title: `سرعة الإطلاق (${upg.firerate}/8)`, max: upg.firerate >= 8 },
        { key: "speed", title: `سرعة المركبة (${upg.speed}/7)`, max: upg.speed >= 7 },
        { key: "hp", title: `درع المركبة (${upg.hp} HP)`, max: false },
        { key: "magnet", title: `مغناطيس الجذب (${upg.magnet}/5)`, max: upg.magnet >= 5 },
        { key: "nova", title: `قوة الضربة الخاصة NOVA (${upg.nova}/5)`, max: upg.nova >= 5 }
      ];

      defs.forEach(d => {
        const row = document.createElement("div");
        row.className = "shop-item";
        const label = document.createElement("div");
        label.style.fontWeight = "700";
        label.textContent = d.title;

        const btn = document.createElement("button");
        const cost = getUpgradeCost(d.key);
        if (d.max) {
          btn.textContent = "MAX";
          btn.disabled = true;
        } else {
          btn.textContent = `شراء (${cost})`;
          btn.disabled = coins < cost;
          btn.onclick = () => buyUpgrade(d.key);
        }

        row.appendChild(label);
        row.appendChild(btn);
        list.appendChild(row);
      });
    }

    function buyUpgrade(key) {
      ensureAudio();
      const cost = getUpgradeCost(key);
      const banner = document.getElementById("shop-banner");
      if (coins < cost) {
        playSfx("hit");
        banner.style.color = "#f87171";
        banner.textContent = "رصيدك غير كافٍ للتطوير ده!";
        return;
      }
      if (key === "multishot" && upg.multishot < 5) { coins -= cost; upg.multishot++; }
      else if (key === "damage") { coins -= cost; upg.damage++; }
      else if (key === "firerate" && upg.firerate < 8) { coins -= cost; upg.firerate++; }
      else if (key === "speed" && upg.speed < 7) { coins -= cost; upg.speed++; }
      else if (key === "hp") { coins -= cost; upg.hp++; }
      else if (key === "magnet" && upg.magnet < 5) { coins -= cost; upg.magnet++; }
      else if (key === "nova" && upg.nova < 5) { coins -= cost; upg.nova++; }
      else return;

      saveProgress();
      playSfx("buy");
      banner.style.color = "#4ade80";
      banner.textContent = "تم التطوير وحفظه بنجاح!";
      renderShopScreen();
    }

    function startLevel(lvl) {
      currentLevel = Math.min(MAX_LEVEL, Math.max(1, lvl));
      clearEntities();
      const th = LEVEL_THEMES[currentLevel - 1];
      wavesPerLevel = th.waves;
      score = 0;
      wave = 1;
      comboCount = 0;
      comboTimer = 0;
      currentHp = upg.hp;
      overdriveTimer = 0;
      magnetTimer = 0;
      shieldTimer = 1.5;
      specialCharge = 0;
      fireCooldown = 0;
      spawnTimer = 0;
      player.x = canvas.width * 0.5;
      player.y = canvas.height - 75;
      player.tilt = 0;
      switchState("PLAYING");
      startWave(1);
    }

    function startWave(w) {
      if (state !== "PLAYING") return;
      wave = w;
      if (wave > wavesPerLevel) {
        bossActive = true;
        enemiesRemaining = 0;
        spawnBoss();
      } else {
        bossActive = false;
        enemiesRemaining = 7 + currentLevel * 2 + wave * 3;
      }
    }

    function spawnBoss() {
      const maxHp = 110 + currentLevel * 95;
      boss = {
        x: canvas.width * 0.5,
        y: 125,
        hp: maxHp,
        maxHp,
        dir: 1,
        shootTimer: 0.4,
        radius: 56
      };
      document.getElementById("boss-bar-wrap").style.display = "block";
      document.getElementById("boss-bar-fill").style.width = "100%";
      screenShake = 12;
      flashAlpha = 0.25;
    }

    function completeLevel() {
      if (state !== "PLAYING") return;
      const th = LEVEL_THEMES[currentLevel - 1];
      coins += th.reward;
      if (score > bestScore) bestScore = score;
      if (currentLevel >= unlockedLevel && unlockedLevel < MAX_LEVEL) {
        unlockedLevel = currentLevel + 1;
      }
      saveProgress();
      playSfx("victory");
      document.getElementById("vic-stats").innerHTML =
        `LEVEL ${currentLevel} CLEARED!<br/>مكافأة الليفل: +${th.reward} عملة<br/>النقاط: ${score} | الأعلى: ${bestScore}`;
      document.getElementById("btn-next-level").style.display = currentLevel < MAX_LEVEL ? "inline-block" : "none";
      switchState("VICTORY");
    }

    function getComboMult() {
      return Math.min(5, Math.max(1, 1 + Math.floor(comboCount / 5)));
    }

    function registerKill() {
      comboCount++;
      comboTimer = 3.5;
    }

    function fireWeapons() {
      playSfx("laser");
      const count = Math.min(7, upg.multishot + (overdriveTimer > 0 ? 2 : 0));
      const dmg = upg.damage + (overdriveTimer > 0 ? 1 : 0);
      const spread = 0.13;
      for (let i = 0; i < count; i++) {
        const offset = i - (count - 1) / 2;
        const angle = offset * spread;
        lasers.push({
          x: player.x + offset * 10,
          y: player.y - 26,
          vx: Math.sin(angle) * 820,
          vy: -Math.cos(angle) * 820,
          angle,
          dmg,
          gold: overdriveTimer > 0
        });
      }
    }

    function spawnChicken() {
      const roll = Math.random();
      let variant = "normal";
      let hp = 2 + currentLevel + Math.floor(wave * 1.2);
      let vy = 85 + Math.random() * 45 + currentLevel * 10 + wave * 4;
      let sway = 95;
      let radius = 22;

      if (roll < 0.09) {
        variant = "golden";
        hp = 3 + currentLevel + wave;
        vy = 120 + Math.random() * 45;
        sway = 155;
      } else if (roll < 0.30) {
        variant = "rusher";
        hp = 2 + currentLevel + wave;
        vy = 165 + Math.random() * 65 + currentLevel * 14;
        sway = 55;
      } else if (roll < 0.50) {
        variant = "armored";
        hp = 6 + currentLevel * 3 + wave * 2;
        vy = 60 + Math.random() * 35 + currentLevel * 6;
        sway = 70;
        radius = 25;
      } else if (roll < 0.68) {
        variant = "sniper";
        hp = 3 + currentLevel + Math.floor(wave * 1.4);
        vy = 75 + Math.random() * 40;
        sway = 120;
      }

      chickens.push({
        x: 60 + Math.random() * Math.max(80, canvas.width - 120),
        y: -35,
        hp,
        vy,
        sway,
        phase: Math.random() * Math.PI * 2,
        shootTimer: 0.9 + Math.random() * 1.4,
        variant,
        radius,
        hitFlash: 0
      });
    }

    function spawnEgg(x, y, vx, vy) {
      eggs.push({ x, y, vx, vy, r: 9 });
    }

    function spawnPickup(x, y, kind, ptype = "") {
      pickups.push({ x, y, kind, ptype, r: 16 });
    }

    function spawnExplosion(x, y, color, count, radius) {
      shockwaves.push({ x, y, r: 10, maxR: radius, color, alpha: 0.7 });
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 40 + Math.random() * 190;
        particles.push({
          x, y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          size: 4 + Math.random() * 5,
          color,
          life: 0.38
        });
      }
    }

    function triggerNova() {
      if (state !== "PLAYING" || specialCharge < 100) return;
      specialCharge = 0;
      screenShake = 20;
      flashAlpha = 0.55;
      playSfx("nova");
      const novaDmg = 30 + upg.damage * 10 + upg.nova * 18;
      shockwaves.push({ x: player.x, y: player.y, r: 20, maxR: 520 + upg.nova * 50, color: "#38bdf8", alpha: 0.85 });
      eggs = [];

      for (let i = chickens.length - 1; i >= 0; i--) {
        chickens[i].hp -= novaDmg;
        if (chickens[i].hp <= 0) {
          registerKill();
          score += 35 * getComboMult();
          spawnExplosion(chickens[i].x, chickens[i].y, "#facc15", 14, 90);
          spawnPickup(chickens[i].x, chickens[i].y, "coin");
          chickens.splice(i, 1);
        }
      }
      if (bossActive && boss) {
        boss.hp -= (novaDmg + 25);
        document.getElementById("boss-bar-fill").style.width = `${Math.max(0, (boss.hp / boss.maxHp) * 100)}%`;
        spawnExplosion(boss.x, boss.y, "#a855f7", 24, 140);
        if (boss.hp <= 0) completeLevel();
      }
    }

    function damagePlayer() {
      if (shieldTimer > 0) {
        shockwaves.push({ x: player.x, y: player.y, r: 15, maxR: 85, color: "#60a5fa", alpha: 0.7 });
        return;
      }
      comboCount = 0;
      comboTimer = 0;
      currentHp--;
      screenShake = 14;
      flashAlpha = 0.25;
      playSfx("hit");
      spawnExplosion(player.x, player.y, "#ef4444", 18, 100);

      if (currentHp <= 0) {
        if (score > bestScore) bestScore = score;
        saveProgress();
        playSfx("explosion");
        document.getElementById("go-stats").innerHTML =
          `LEVEL ${currentLevel}<br/>النقاط: ${score} | الأعلى: ${bestScore}<br/>الفلوس الحالية: ${coins}`;
        switchState("GAMEOVER");
      }
    }

    function update(dt) {
      const th = LEVEL_THEMES[currentLevel - 1];
      const bgSpdMult = (state === "PLAYING" ? ((bossActive ? 1.85 : 1.0) * th.spd) : 0.85);

      for (const s of stars) {
        s.y += s.spd * bgSpdMult * dt;
        if (s.y > canvas.height) {
          s.y = -4;
          s.x = Math.random() * canvas.width;
        }
      }

      if (state !== "PLAYING") return;

      if (screenShake > 0) screenShake = Math.max(0, screenShake - dt * 28);
      if (flashAlpha > 0) flashAlpha = Math.max(0, flashAlpha - dt * 1.4);
      if (overdriveTimer > 0) overdriveTimer = Math.max(0, overdriveTimer - dt);
      if (magnetTimer > 0) magnetTimer = Math.max(0, magnetTimer - dt);
      if (shieldTimer > 0) shieldTimer = Math.max(0, shieldTimer - dt);
      if (comboTimer > 0) {
        comboTimer -= dt;
        if (comboTimer <= 0) comboCount = 0;
      }

      let moveDir = 0;
      if (keys.left) moveDir -= 1;
      if (keys.right) moveDir += 1;
      const spd = (440 + upg.speed * 58) * (bossActive ? 1.2 : 1.0);
      player.x = Math.min(Math.max(player.x + moveDir * spd * dt, 40), canvas.width - 40);
      player.tilt += (moveDir * 0.22 - player.tilt) * Math.min(1, dt * 14);

      fireCooldown -= dt;
      const delay = Math.max(0.06, (0.32 - upg.firerate * 0.03) * (overdriveTimer > 0 ? 0.55 : 1.0));
      if (fireCooldown <= 0) {
        fireCooldown = delay;
        fireWeapons();
      }

      if (!bossActive && enemiesRemaining > 0) {
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          spawnTimer = Math.max(0.22, 0.9 - currentLevel * 0.09 - wave * 0.04);
          enemiesRemaining--;
          spawnChicken();
        }
      }

      // تحديث الليزر
      for (let i = lasers.length - 1; i >= 0; i--) {
        const l = lasers[i];
        l.x += l.vx * dt;
        l.y += l.vy * dt;
        if (l.y < -30 || l.x < -30 || l.x > canvas.width + 30) {
          lasers.splice(i, 1);
          continue;
        }
        let hit = false;
        for (let j = chickens.length - 1; j >= 0; j--) {
          const c = chickens[j];
          if (Math.hypot(l.x - c.x, l.y - c.y) < c.radius + 8) {
            c.hp -= l.dmg;
            c.hitFlash = 0.08;
            specialCharge = Math.min(100, specialCharge + 3.5);
            hit = true;
            if (c.hp <= 0) {
              registerKill();
              const mult = getComboMult();
              if (c.variant === "golden") {
                score += 120 * mult;
                coins += 35;
                playSfx("powerup");
                spawnExplosion(c.x, c.y, "#fef08a", 20, 120);
                spawnPickup(c.x, c.y, "powerup", "overdrive");
              } else {
                score += 30 * mult;
                playSfx("explosion");
                spawnExplosion(c.x, c.y, "#f8fafc", 14, 85);
                if (Math.random() < 0.78) spawnPickup(c.x, c.y, "coin");
                if (Math.random() < 0.25) {
                  const ptypes = ["overdrive", "heal", "magnet", "nova", "shield"];
                  spawnPickup(c.x, c.y, "powerup", ptypes[Math.floor(Math.random() * ptypes.length)]);
                }
              }
              chickens.splice(j, 1);
            }
            break;
          }
        }
        if (!hit && bossActive && boss) {
          if (Math.hypot(l.x - boss.x, l.y - boss.y) < boss.radius + 8) {
            boss.hp -= l.dmg;
            specialCharge = Math.min(100, specialCharge + 2.5);
            hit = true;
            document.getElementById("boss-bar-fill").style.width = `${Math.max(0, (boss.hp / boss.maxHp) * 100)}%`;
            if (boss.hp <= 0) {
              playSfx("explosion");
              score += 600 * getComboMult();
              coins += 65;
              spawnExplosion(boss.x, boss.y, "#a855f7", 36, 180);
              completeLevel();
            }
          }
        }
        if (hit) lasers.splice(i, 1);
      }

      // تحديث الفراخ
      const tNow = performance.now() * 0.005;
      for (let i = chickens.length - 1; i >= 0; i--) {
        const c = chickens[i];
        c.y += c.vy * th.spd * (bossActive ? 1.3 : 1.0) * dt;
        c.x += Math.sin(tNow + c.phase) * c.sway * dt;
        c.x = Math.min(Math.max(c.x, 35), canvas.width - 35);
        if (c.hitFlash > 0) c.hitFlash -= dt;

        c.shootTimer -= dt;
        if (c.shootTimer <= 0) {
          c.shootTimer = (1.3 + Math.random() * 1.6) / Math.max(0.85, th.spd * 0.85);
          spawnEgg(c.x, c.y + 18, 0, 300 + currentLevel * 22 + wave * 12);
        }

        if (Math.hypot(c.x - player.x, c.y - player.y) < c.radius + 18) {
          chickens.splice(i, 1);
          damagePlayer();
          continue;
        }
        if (c.y > canvas.height + 40) chickens.splice(i, 1);
      }

      // تحديث البوس
      if (bossActive && boss) {
        boss.x += boss.dir * (195 + currentLevel * 24 + wave * 12) * dt;
        if (boss.x > canvas.width - 100) boss.dir = -1;
        if (boss.x < 100) boss.dir = 1;

        boss.shootTimer -= dt;
        if (boss.shootTimer <= 0) {
          boss.shootTimer = Math.max(0.45, 1.25 - currentLevel * 0.12 - wave * 0.04);
          const angles = currentLevel >= 3 ? [-0.45, -0.22, 0, 0.22, 0.45] : [-0.35, 0, 0.35];
          for (const a of angles) {
            spawnEgg(boss.x, boss.y + 40, Math.sin(a) * 350, Math.cos(a) * 350);
          }
        }
      }

      // تحديث البيض
      for (let i = eggs.length - 1; i >= 0; i--) {
        const e = eggs[i];
        e.x += e.vx * dt;
        e.y += e.vy * dt;
        if (Math.hypot(e.x - player.x, e.y - player.y) < e.r + 16) {
          eggs.splice(i, 1);
          damagePlayer();
          continue;
        }
        if (e.y > canvas.height + 30 || e.x < -30 || e.x > canvas.width + 30) eggs.splice(i, 1);
      }

      // تحديث العملات والتعزيزات
      const magRad = 140 + upg.magnet * 75 + (magnetTimer > 0 ? 260 : 0);
      for (let i = pickups.length - 1; i >= 0; i--) {
        const p = pickups[i];
        const dist = Math.hypot(p.x - player.x, p.y - player.y);
        if (dist < magRad && dist > 1) {
          p.x += ((player.x - p.x) / dist) * (340 + upg.magnet * 60) * dt;
          p.y += ((player.y - p.y) / dist) * (340 + upg.magnet * 60) * dt;
        } else {
          p.y += 185 * dt;
        }

        if (dist < p.r + 22) {
          if (p.kind === "coin") {
            coins += 15;
            score += 10 * getComboMult();
            specialCharge = Math.min(100, specialCharge + 5);
            playSfx("coin");
          } else {
            playSfx("powerup");
            if (p.ptype === "overdrive") overdriveTimer = 7;
            else if (p.ptype === "heal") currentHp = Math.min(upg.hp, currentHp + 1);
            else if (p.ptype === "magnet") magnetTimer = 8;
            else if (p.ptype === "nova") specialCharge = 100;
            else if (p.ptype === "shield") shieldTimer = 6;
          }
          pickups.splice(i, 1);
          continue;
        }
        if (p.y > canvas.height + 35) pickups.splice(i, 1);
      }

      // موجات ومؤثرات
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx * dt;
        pt.y += pt.vy * dt;
        pt.life -= dt;
        if (pt.life <= 0) particles.splice(i, 1);
      }
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.r += (sw.maxR - sw.r) * Math.min(1, dt * 11);
        sw.alpha -= dt * 2.2;
        if (sw.alpha <= 0) shockwaves.splice(i, 1);
      }

      if (!bossActive && enemiesRemaining === 0 && chickens.length === 0) {
        startWave(wave + 1);
      }

      // تحديث HUD
      document.getElementById("hud-score").textContent = `النقاط: ${score}`;
      document.getElementById("hud-coins").textContent = `الفلوس: ${coins}`;
      document.getElementById("hud-combo").textContent = comboCount > 1 ? `COMBO x${getComboMult()} (${comboTimer.toFixed(1)}s)` : "";
      document.getElementById("hud-wave").textContent = `L${currentLevel} - Wave ${Math.min(wave, wavesPerLevel)}/${wavesPerLevel}`;
      document.getElementById("hud-hp").textContent = `الصحة: ${currentHp} / ${upg.hp}`;
      document.getElementById("nova-bar-fill").style.width = `${specialCharge}%`;

      let buffs = "";
      if (overdriveTimer > 0) buffs += `OVERDRIVE ${overdriveTimer.toFixed(1)}s  `;
      if (magnetTimer > 0) buffs += `MAGNET ${magnetTimer.toFixed(1)}s  `;
      if (shieldTimer > 0) buffs += `SHIELD ${shieldTimer.toFixed(1)}s  `;
      if (specialCharge >= 100) buffs += `[اضغط Q للضربة NOVA!]`;
      document.getElementById("hud-buffs").textContent = buffs;
    }

    function draw() {
      const th = LEVEL_THEMES[currentLevel - 1];
      ctx.save();
      if (screenShake > 0) {
        ctx.translate((Math.random() - 0.5) * screenShake * 2, (Math.random() - 0.5) * screenShake * 2);
      }

      ctx.fillStyle = th.bg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // سدم خفيفة
      ctx.fillStyle = th.neb1;
      ctx.beginPath();
      ctx.arc(canvas.width * 0.22, canvas.height * 0.28, 190, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = th.neb2;
      ctx.beginPath();
      ctx.arc(canvas.width * 0.78, canvas.height * 0.42, 220, 0, Math.PI * 2);
      ctx.fill();

      // النجوم
      for (const s of stars) {
        ctx.fillStyle = `rgba(210, 235, 255, ${s.a})`;
        ctx.fillRect(s.x, s.y, s.s, s.s);
      }

      if (state === "PLAYING") {
        // الليزر
        for (const l of lasers) {
          ctx.save();
          ctx.translate(l.x, l.y);
          ctx.rotate(l.angle);
          ctx.fillStyle = l.gold ? "#facc15" : "#38bdf8";
          ctx.fillRect(-3.5, -11, 7, 22);
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(-1.5, -10, 3, 20);
          ctx.restore();
        }

        // الفراخ
        for (const c of chickens) {
          ctx.save();
          ctx.translate(c.x, c.y);
          let body = "#f8fafc";
          if (c.variant === "golden") body = "#fef08a";
          else if (c.variant === "rusher") body = "#fca5a5";
          else if (c.variant === "armored") body = "#94a3b8";
          else if (c.variant === "sniper") body = "#d8b4fe";
          if (c.hitFlash > 0) body = "#ffffff";

          ctx.fillStyle = body;
          ctx.beginPath();
          ctx.arc(0, 0, c.radius * 0.78, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "#dc2626";
          ctx.fillRect(-5, -c.radius - 3, 10, 6);

          ctx.fillStyle = "#f97316";
          ctx.beginPath();
          ctx.moveTo(-4, 2); ctx.lineTo(4, 2); ctx.lineTo(0, 9);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = "#0f172a";
          ctx.fillRect(-7, -5, 3, 3);
          ctx.fillRect(4, -5, 3, 3);
          ctx.restore();
        }

        // الزعيم
        if (bossActive && boss) {
          ctx.save();
          ctx.translate(boss.x, boss.y);
          ctx.fillStyle = "#7e22ce";
          ctx.beginPath();
          ctx.arc(0, 0, boss.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#eab308";
          ctx.beginPath();
          ctx.arc(0, 12, boss.radius * 0.48, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#ef4444";
          ctx.fillRect(-18, -14, 9, 7);
          ctx.fillRect(9, -14, 9, 7);
          ctx.restore();
        }

        // البيض
        for (const e of eggs) {
          ctx.fillStyle = "#fde68a";
          ctx.beginPath();
          ctx.ellipse(e.x, e.y, 7, 9.5, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        // العملات والتعزيزات
        for (const p of pickups) {
          if (p.kind === "coin") {
            ctx.fillStyle = "#eab308";
            ctx.beginPath();
            ctx.arc(p.x, p.y, 9, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#fef08a";
            ctx.beginPath();
            ctx.arc(p.x, p.y, 5.5, 0, Math.PI * 2);
            ctx.fill();
          } else {
            const pcols = { overdrive: "#facc15", heal: "#4ade80", magnet: "#38bdf8", nova: "#e879f9", shield: "#60a5fa" };
            ctx.fillStyle = pcols[p.ptype] || "#ffffff";
            ctx.fillRect(p.x - 11, p.y - 11, 22, 22);
          }
        }

        // المركبة
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(player.tilt);

        // لهب المحرك
        ctx.fillStyle = Math.random() < 0.5 ? "#facc15" : "#f97316";
        ctx.beginPath();
        ctx.moveTo(-7, 22); ctx.lineTo(7, 22); ctx.lineTo(0, 36);
        ctx.closePath();
        ctx.fill();

        // جسم المركبة
        ctx.fillStyle = "#0ea5e9";
        ctx.beginPath();
        ctx.moveTo(0, -26);
        ctx.lineTo(24, 20);
        ctx.lineTo(-24, 20);
        ctx.closePath();
        ctx.fill();

        // قمرة القيادة
        ctx.fillStyle = "#bae6fd";
        ctx.beginPath();
        ctx.arc(0, -2, 6, 0, Math.PI * 2);
        ctx.fill();

        if (shieldTimer > 0) {
          ctx.strokeStyle = "rgba(96, 165, 250, 0.85)";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(0, 0, 34, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();

        // موجات الصدمة والبارتكلز
        for (const sw of shockwaves) {
          ctx.strokeStyle = sw.color;
          ctx.globalAlpha = Math.max(0, sw.alpha);
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;

        for (const pt of particles) {
          ctx.fillStyle = pt.color;
          ctx.globalAlpha = Math.max(0, pt.life / 0.38);
          ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
        }
        ctx.globalAlpha = 1;

        if (flashAlpha > 0) {
          ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
      }

      ctx.restore();
    }

    let lastTime = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    // أحداث التحكم والأزرار
    window.addEventListener("resize", resize);
    window.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = true;
      if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = true;
      if (e.key === "q" || e.key === "Q" || e.key === "Shift") triggerNova();
    });
    window.addEventListener("keyup", e => {
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
      if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
    });

    canvas.addEventListener("pointermove", e => {
      if (state === "PLAYING" && e.pointerType === "mouse") {
        player.x = Math.min(Math.max(e.clientX, 40), canvas.width - 40);
      }
    });

    const bLeft = document.getElementById("btn-left");
    const bRight = document.getElementById("btn-right");
    bLeft.addEventListener("pointerdown", () => keys.left = true);
    bLeft.addEventListener("pointerup", () => keys.left = false);
    bLeft.addEventListener("pointerleave", () => keys.left = false);
    bRight.addEventListener("pointerdown", () => keys.right = true);
    bRight.addEventListener("pointerup", () => keys.right = false);
    bRight.addEventListener("pointerleave", () => keys.right = false);
    document.getElementById("btn-nova").addEventListener("click", triggerNova);

    document.getElementById("btn-play-current").onclick = () => { ensureAudio(); startLevel(unlockedLevel); };
    document.getElementById("btn-open-levels").onclick = () => { ensureAudio(); switchState("LEVELS"); };
    document.getElementById("btn-open-shop").onclick = () => { ensureAudio(); switchState("SHOP"); };
    document.getElementById("btn-levels-back").onclick = () => switchState("MENU");
    document.getElementById("btn-shop-back").onclick = () => switchState("MENU");
    document.getElementById("btn-retry").onclick = () => startLevel(currentLevel);
    document.getElementById("btn-go-shop").onclick = () => switchState("SHOP");
    document.getElementById("btn-go-menu").onclick = () => switchState("MENU");
    document.getElementById("btn-next-level").onclick = () => startLevel(Math.min(MAX_LEVEL, currentLevel + 1));
    document.getElementById("btn-vic-shop").onclick = () => switchState("SHOP");
    document.getElementById("btn-vic-menu").onclick = () => switchState("MENU");

    loadProgress();
    resize();
    initStars();
    requestAnimationFrame(loop);
  </script>
